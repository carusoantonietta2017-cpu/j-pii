<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1217">
<meta name="description" content="Converti documenti in Markdown e gestisci dizionari wiki. Tutto in locale.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
<title>ocr-pi — Banco Documenti</title>
</head>
<body>
<a class="skip" href="#split">Salta al contenuto</a>
<header class="topbar">
  <button id="burger" class="iconbtn" aria-label="Apri menu">☰</button>
  <div class="brand">
    <img src="icon.svg" alt="" width="26" height="26" aria-hidden="true">
    <h1 translate="no">ocr-pi</h1>
    <span class="badge" title="Tutto gira su questa macchina"><span class="dot" aria-hidden="true"></span> Solo locale</span>
  </div>
  <form id="gsearch" class="globalsearch" role="search" aria-label="Ricerca globale nelle wiki">
    <input type="search" id="gq" name="q" autocomplete="off" placeholder="Cerca nelle wiki, es. iva…" aria-label="Cerca nelle wiki">
    <select id="gstato" name="stato" aria-label="Filtra per stato">
      <option value="">Tutti gli stati</option>
      <option value="draft">Draft</option>
      <option value="reviewed">Reviewed</option>
      <option value="versioned">Versioned</option>
    </select>
    <button class="btn small" type="submit">Cerca</button>
  </form>
  <div class="top-actions">
    <span class="modelbadge" id="modelbadge" title="Modello del dock agente">…</span>
    <button id="dockassist" class="iconbtn" type="button" aria-label="Apri assistente pi" title="Assistente pi">🤖</button>
    <button id="themebtn" class="iconbtn" aria-label="Cambia tema chiaro o scuro" title="Tema">◐</button>
    <button id="newwikibtn" class="btn hide-sm" type="button">Nuova wiki</button>
    <label class="filebtn">Converti file…<input type="file" id="upick" accept=".pdf,.png,.jpg,.jpeg,.webp,.tiff,.tif,.gif,.bmp" aria-label="Scegli file da convertire"></label>
  </div>
</header>
<div id="work">
  <aside id="side" aria-label="Dizionari e sorgenti" data-testid="nav-sidebar">
    <div class="side-search">
      <label class="hint" for="q">Filtra la sidebar</label>
      <input id="q" type="search" name="filtra" autocomplete="off" placeholder="Filtra voci, es. fattura…" aria-label="Filtra voci nella sidebar">
    </div>
    <h2>Sorgenti file</h2>
    <ul id="folder" class="side-list" data-testid="nav-sources"></ul>
    <div class="sechead"><h2>Wiki</h2><button class="iconbtn" id="wikimenubtn" aria-label="Menu wiki" aria-expanded="false" aria-haspopup="menu">⋯</button></div>
    <div id="mtoast" role="status" aria-live="polite"></div>
    <div id="wikimenu" role="menu" aria-label="Azioni wiki">
      <button data-m="new" role="menuitem">+ Nuova wiki…<small>Crea un dizionario vuoto</small></button>
      <button data-m="addvoce" role="menuitem">Nuova voce…<small>Scrivi Markdown a mano</small></button>
      <button data-m="export" role="menuitem">Esporta zip<small>Completo, con originali</small></button>
      <button data-m="export-slim" role="menuitem">Esporta senza originali<small>Zip leggero</small></button>
      <button data-m="import" role="menuitem">Importa zip…<small>Con opzione merge</small></button>
      <button data-m="rename" role="menuitem">Rinomina…<small>Nuovo slug</small></button>
      <button data-m="trashview" role="menuitem">Vedi cestino<small>Voci cestinate</small></button>
      <button data-m="removewiki" role="menuitem" class="danger">Elimina wiki…<small>Serve conferma</small></button>
    </div>
    <ul id="wikis" class="side-list" data-testid="nav-wiki-list"></ul>
    <h2>Altro</h2>
    <ul class="side-list"><li class="sub" id="trashli"><button id="trashbtn" type="button">Cestino (<span id="trashn">0</span>)</button></li></ul>
  </aside>
  <main id="split" data-tab="pdf" data-testid="viewer-split">
    <div class="crumbs" id="crumbs" aria-label="Posizione" data-testid="nav-crumbs">
      <nav aria-label="Breadcrumb"><span class="hint">Scegli una voce dalla sidebar, oppure converti un file.</span></nav>
    </div>
    <div class="tabs" role="tablist" aria-label="Viste documento">
      <button id="tPdf" aria-pressed="true" role="tab">Originale</button>
      <button id="tMd" aria-pressed="false" role="tab">Convertito</button>
    </div>
    <div id="splitpanes">
      <section class="pane left" aria-label="Originale" data-testid="viewer-original"><div id="orig"></div></section>
      <section class="pane right" aria-label="Convertito" data-testid="editor-md"><div id="conv"></div></section>
    </div>
  </main>
</div>
<section id="dock" aria-label="Agente pi" data-testid="dock" data-mode="embedded">
  <div id="dockhead">
    <span aria-hidden="true">🤖</span>
    <h2>Agente pi</h2>
    <span class="pill" id="dockmodel" translate="no" data-testid="dock-model">…</span>
    <button id="docknew" class="mini" type="button" title="Azzera la conversazione">Nuova conversazione</button>
    <button id="dockpop" class="mini" type="button" title="Stacca come popup" aria-label="Stacca come popup">⧉</button>
    <button id="dockpin" class="mini" type="button" title="Riaggancia in pagina" aria-label="Riaggancia in pagina" hidden>🗔</button>
    <button id="docktoggle" type="button" aria-expanded="false">Espandi agente</button>
  </div>
  <div id="docklog" aria-live="polite" data-testid="dock-log"></div>
  <div id="chips">
    <button data-q="Elenca le wiki" type="button">Elenca le wiki</button>
    <button data-q="Cerca iva tra le voci" type="button">Cerca iva</button>
    <button data-q="Cosa sai fare?" type="button">Cosa sai fare?</button>
  </div>
  <div id="dockopts">
    <label><input type="checkbox" id="dockocr" checked> OCR immagini</label>
    <label><input type="checkbox" id="docksens"> Sensibili (mask)</label>
    <label for="dockengine">Motore</label>
    <select id="dockengine"><option>docling</option><option>fake</option></select>
    <label><input type="checkbox" id="dockdeskew"> Deskew</label>
    <label for="dockimg">Allega <span class="hint">(anche più file)</span></label>
    <input type="file" id="dockimg" accept="image/*,.pdf" multiple aria-label="Allega immagini o PDF">
  </div>
  <div id="dockfiles" aria-live="polite"></div>
  <details id="llmlogbox" data-testid="llm-log">
    <summary>Trasparenza: cosa vede l'LLM <span class="hint" id="llmcount"></span></summary>
    <div id="llmwarn" role="alert" hidden></div>
    <div id="llmlog" aria-live="polite"></div>
    <div class="toolbar"><button id="llmrefresh" class="mini" type="button">Aggiorna log</button></div>
  </details>
  <form id="dockform">
    <input id="dockin" type="text" name="comando" autocomplete="off" placeholder="Chiedi all’agente, es. crea una wiki con questi file…" aria-label="Comando per l’agente">
    <button class="btn primary" id="docksend" type="submit">Invia</button>
  </form>
</section>
<dialog id="dlg" aria-labelledby="dlgtitle">
  <div class="dlg-head"><h2 id="dlgtitle">Dialogo</h2></div>
  <div class="dlg-body" id="dlgbody"></div>
  <div class="dlg-actions" id="dlgactions"></div>
</dialog>
<input type="file" id="impick" accept=".zip" hidden tabindex="-1" aria-hidden="true">
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
